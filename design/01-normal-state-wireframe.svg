  <rect x="1060" y="10" width="120" height="28" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="1072" y="28" fill="#94a3b8" font-size="12">13" Dense Mode</text>

  <!-- Filter Builder Section -->
  <rect x="16" y="58" width="1168" height="116" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="32" y="80" fill="#e2e8f0" font-size="13" font-weight="bold">⚡ FILTER BUILDER (Groups combine with AND · Inside group with OR)</text>
  
  <!-- Group 1 -->
  <rect x="32" y="92" width="620" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-dasharray="3,3"/>
  <text x="44" y="110" fill="#94a3b8" font-size="11">Group 1 (OR)</text>
  <!-- Condition 1 -->
  <rect x="110" y="98" width="80" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="118" y="114" fill="#cbd5e1" font-size="11">status</text>
  <rect x="195" y="98" width="60" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="202" y="114" fill="#cbd5e1" font-size="11">is one of</text>
  <rect x="260" y="98" width="130" height="24" rx="3" fill="#1e293b" stroke="#38bdf8"/>
  <text x="266" y="114" fill="#38bdf8" font-size="11">shipped, delivered</text>
  <text x="400" y="114" fill="#ef4444" font-size="14" font-weight="bold">×</text>
  
  <text x="420" y="114" fill="#f59e0b" font-size="11" font-weight="bold">OR</text>
  <!-- Condition 2 -->
  <rect x="450" y="98" width="70" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="456" y="114" fill="#cbd5e1" font-size="11">priority</text>
  <rect x="525" y="98" width="40" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="532" y="114" fill="#cbd5e1" font-size="11">=</text>
  <rect x="570" y="98" width="45" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="578" y="114" fill="#cbd5e1" font-size="11">1 (High)</text>
  <text x="625" y="114" fill="#ef4444" font-size="14" font-weight="bold">×</text>

  <rect x="44" y="132" width="95" height="22" rx="3" fill="#334155"/>
  <text x="52" y="147" fill="#cbd5e1" font-size="11">+ Condition (OR)</text>

  <!-- AND connector -->
  <text x="668" y="132" fill="#38bdf8" font-size="13" font-weight="bold">AND</text>

  <!-- Group 2 -->
  <rect x="715" y="92" width="350" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-dasharray="3,3"/>
  <text x="725" y="110" fill="#94a3b8" font-size="11">Group 2</text>
  <rect x="775" y="98" width="75" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="782" y="114" fill="#cbd5e1" font-size="11">amount</text>
  <rect x="855" y="98" width="30" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="863" y="114" fill="#cbd5e1" font-size="11">&gt;</text>
  <rect x="890" y="98" width="70" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="898" y="114" fill="#cbd5e1" font-size="11">₹5,000</text>
  <text x="968" y="114" fill="#ef4444" font-size="14" font-weight="bold">×</text>
  <rect x="725" y="132" width="95" height="22" rx="3" fill="#334155"/>
  <text x="733" y="147" fill="#cbd5e1" font-size="11">+ Condition (OR)</text>

