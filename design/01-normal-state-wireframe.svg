  <rect x="110" y="188" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="122" y="204" fill="#38bdf8" font-size="11">Status: shipped, delivered ×</text>

  <rect x="300" y="188" width="120" height="24" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="312" y="204" fill="#38bdf8" font-size="11">Amount &gt; ₹5,000 ×</text>

