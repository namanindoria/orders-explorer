<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#1e293b" stroke="#334155" stroke-width="1"/>
