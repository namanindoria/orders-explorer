<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" style="background:#fdfbf7; font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive, sans-serif;">
  <defs>
    <!-- Sketch filter for hand-drawn wobble effect -->
    <filter id="sketch-wobble" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="hand-drawn" x="-1%" y="-1%" width="102%" height="102%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Canvas Paper Grid Pattern -->
  <rect width="1280" height="840" fill="#fdfbf7"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.8" fill="#e5e5e0" />
  </pattern>
  <rect width="1280" height="840" fill="url(#grid)" />

  <!-- Title & Brainstorming Header -->
  <g filter="url(#hand-drawn)">
    <text x="36" y="44" font-size="24" font-weight="bold" fill="#1e293b">✏️ Orders Explorer — UI Sketch / Wireframe (13" Laptop Screen)</text>
    <text x="36" y="68" font-size="14" fill="#64748b">Audience: Operations team • High density • Keyboard-first • Fast scanning</text>

    <!-- Post-it Note: Ops Requirement -->
    <rect x="940" y="20" width="300" height="74" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="3,1" transform="rotate(-1 940 20)"/>
    <text x="955" y="42" font-size="13" font-weight="bold" fill="#854d0e" transform="rotate(-1 940 20)">📌 Design Notes (13" Display):</text>
    <text x="955" y="60" font-size="12" fill="#854d0e" transform="rotate(-1 940 20)">• Row height 32-34px (fit ~20 rows)</text>
    <text x="955" y="78" font-size="12" fill="#854d0e" transform="rotate(-1 940 20)">• Dense ops view, no big empty padding!</text>
  </g>

  <!-- 1. Top Navbar Wireframe -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="105" width="1208" height="46" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>
    <text x="52" y="134" font-size="17" font-weight="bold" fill="#0f172a">◈ Merkle Science | Orders Explorer</text>
    
    <!-- Keyboard Cheatsheet Pill -->
    <rect x="360" y="114" width="410" height="28" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="375" y="133" font-size="13" fill="#475569">⌨ [↑↓←→ Move]  [Space Select]  [Enter Details]  [Esc Close]</text>

    <!-- Export Button Box -->
    <rect x="1065" y="112" width="165" height="32" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#0284c7" stroke-width="2"/>
    <text x="1080" y="133" font-size="14" font-weight="bold" fill="#0369a1">📥 Export CSV (20)</text>
  </g>

  <!-- 2. Filter Builder Wireframe -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="165" width="1208" height="130" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>
    <text x="52" y="188" font-size="15" font-weight="bold" fill="#334155">⚡ FILTER BUILDER (Groups combine with AND · Inside group with OR)</text>

    <!-- Group 1 -->
    <rect x="52" y="200" width="600" height="82" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,3"/>
    <text x="64" y="218" font-size="12" font-weight="bold" fill="#64748b">Group 1 (OR)</text>
    
    <!-- Condition 1: status -->
    <rect x="135" y="207" width="75" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="145" y="224" font-size="13" fill="#1e293b">status</text>
    <rect x="216" y="207" width="70" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="224" y="224" font-size="12" fill="#1e293b">is one of</text>
    <rect x="292" y="207" width="140" height="26" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="300" y="224" font-size="13" font-weight="bold" fill="#0369a1">shipped, delivered</text>
    <text x="440" y="225" font-size="16" font-weight="bold" fill="#e11d48">×</text>

    <!-- OR label -->
    <text x="465" y="225" font-size="13" font-weight="bold" fill="#d97706">OR</text>

    <!-- Condition 2: priority -->
    <rect x="495" y="207" width="70" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="502" y="224" font-size="13" fill="#1e293b">priority</text>
    <rect x="570" y="207" width="30" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="578" y="224" font-size="13" fill="#1e293b">=</text>
    <rect x="605" y="207" width="30" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="614" y="224" font-size="13" fill="#1e293b">1</text>
    <text x="640" y="225" font-size="16" font-weight="bold" fill="#e11d48">×</text>

    <!-- + Condition inside Group 1 -->
    <rect x="64" y="246" width="130" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="74" y="262" font-size="12" fill="#334155">+ Add Condition (OR)</text>

    <!-- AND connector between groups -->
    <circle cx="682" cy="241" r="16" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="668" y="246" font-size="12" font-weight="bold" fill="#ffffff">AND</text>

    <!-- Group 2 -->
    <rect x="714" y="200" width="390" height="82" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,3"/>
    <text x="726" y="218" font-size="12" font-weight="bold" fill="#64748b">Group 2</text>
    <rect x="780" y="207" width="70" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="788" y="224" font-size="13" fill="#1e293b">amount</text>
    <rect x="856" y="207" width="35" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="866" y="224" font-size="13" fill="#1e293b">&gt;</text>
    <rect x="897" y="207" width="75" height="26" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="906" y="224" font-size="13" fill="#1e293b">₹5,000</text>
    <text x="980" y="225" font-size="16" font-weight="bold" fill="#e11d48">×</text>
    
    <rect x="726" y="246" width="130" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="736" y="262" font-size="12" fill="#334155">+ Add Condition (OR)</text>

    <!-- + Add Group button -->
    <rect x="1118" y="220" width="112" height="38" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="1128" y="244" font-size="13" font-weight="bold" fill="#15803d">+ Add Group</text>
  </g>

  <!-- 3. Active Filter Chips & Counter -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="306" width="1208" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="50" y="331" font-size="13" font-weight="bold" fill="#64748b">ACTIVE CHIPS:</text>
    
    <!-- Chip 1 -->
    <rect x="145" y="313" width="190" height="25" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="156" y="330" font-size="12" font-weight="bold" fill="#0369a1">Status: shipped, delivered ×</text>

    <!-- Chip 2 -->
    <rect x="345" y="313" width="130" height="25" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="356" y="330" font-size="12" font-weight="bold" fill="#0369a1">Amount &gt; ₹5,000 ×</text>

    <!-- Clear all -->
    <text x="490" y="330" font-size="13" font-weight="bold" fill="#e11d48" text-decoration="underline">Clear all ↺</text>

    <!-- Live Counter & Selection Status -->
    <rect x="850" y="312" width="220" height="27" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="860" y="330" font-size="13" fill="#1e40af">Showing <tspan font-weight="bold">1,284</tspan> of 50,000 orders</text>

    <rect x="1080" y="312" width="154" height="27" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="1088" y="330" font-size="12" font-weight="bold" fill="#1d4ed8">✓ 20 selected (filtered)</text>
  </g>

  <!-- 4. Virtual Data Grid Wireframe -->
  <g filter="url(#hand-drawn)">
    <!-- Grid Outer Container -->
    <rect x="36" y="356" width="810" height="420" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>

    <!-- Sticky Header Row -->
    <rect x="36" y="356" width="810" height="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Header cells -->
    <rect x="36" y="356" width="34" height="36" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="46" y="368" width="14" height="14" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Pinned Column Header -->
    <rect x="70" y="356" width="115" height="36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="379" font-size="13" font-weight="bold" fill="#0f172a">📌 Order ID ▲</text>
    <!-- Resize handle icon -->
    <line x1="185" y1="360" x2="185" y2="388" stroke="#3b82f6" stroke-width="2.5"/>

    <text x="195" y="379" font-size="13" font-weight="bold" fill="#334155">Customer</text>
    <line x1="330" y1="360" x2="330" y2="388" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="340" y="379" font-size="13" font-weight="bold" fill="#334155">Status ▼</text>
    <line x1="420" y1="360" x2="420" y2="388" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="500" y="379" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">Amount (₹)</text>
    <line x1="510" y1="360" x2="510" y2="388" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="520" y="379" font-size="13" font-weight="bold" fill="#334155">Created Date</text>
    <line x1="640" y1="360" x2="640" y2="388" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="650" y="379" font-size="13" font-weight="bold" fill="#334155">Region</text>
    <line x1="720" y1="360" x2="720" y2="388" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="730" y="379" font-size="13" font-weight="bold" fill="#334155">Channel</text>

    <!-- Row 1: Selected + Focused Cell -->
    <rect x="36" y="392" width="810" height="34" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="46" y="402" width="14" height="14" rx="2" fill="#3b82f6" stroke="#2563eb"/>
    <text x="50" y="413" font-size="11" fill="#ffffff" font-weight="bold">✓</text>
    <text x="80" y="414" font-size="12" font-family="monospace" font-weight="bold" fill="#0284c7">ORD-000142</text>
    <text x="195" y="414" font-size="12" fill="#1e293b">Rohan Sharma</text>
    
    <!-- Status pill -->
    <rect x="338" y="399" width="62" height="19" rx="9" fill="#dcfce7" stroke="#16a34a"/>
    <text x="348" y="413" font-size="11" font-weight="bold" fill="#15803d">shipped</text>
    
    <!-- Focused cell outline -->
    <rect x="420" y="392" width="90" height="34" fill="#bae6fd" fill-opacity="0.3" stroke="#0284c7" stroke-width="2.5"/>
    <text x="500" y="414" font-size="12" font-family="monospace" font-weight="bold" fill="#0f172a" text-anchor="end">₹8,499.00</text>
    
    <text x="520" y="414" font-size="11" fill="#475569">14 Mar 2025, 09:30 UTC</text>
    <text x="650" y="414" font-size="12" fill="#1e293b">NORTH</text>
    <text x="730" y="414" font-size="12" fill="#1e293b">web</text>

    <!-- Row 2 -->
    <rect x="36" y="426" width="810" height="34" fill="#ffffff" stroke="#f1f5f9"/>
    <rect x="46" y="436" width="14" height="14" rx="2" fill="#ffffff" stroke="#94a3b8"/>
    <text x="80" y="448" font-size="12" font-family="monospace" fill="#334155">ORD-000145</text>
    <text x="195" y="448" font-size="12" fill="#1e293b">Priya Patel</text>
    <rect x="338" y="433" width="65" height="19" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="345" y="447" font-size="11" font-weight="bold" fill="#1e40af">delivered</text>
    <text x="500" y="448" font-size="12" font-family="monospace" fill="#0f172a" text-anchor="end">₹12,450.00</text>
    <text x="520" y="448" font-size="11" fill="#475569">14 Mar 2025, 11:15 UTC</text>
    <text x="650" y="448" font-size="12" fill="#1e293b">WEST</text>
    <text x="730" y="448" font-size="12" fill="#1e293b">app</text>

    <!-- Row 3 -->
    <rect x="36" y="460" width="810" height="34" fill="#f8fafc" stroke="#f1f5f9"/>
    <rect x="46" y="470" width="14" height="14" rx="2" fill="#ffffff" stroke="#94a3b8"/>
    <text x="80" y="482" font-size="12" font-family="monospace" fill="#334155">ORD-000150</text>
    <text x="195" y="482" font-size="12" fill="#1e293b">Amit Verma</text>
    <rect x="338" y="467" width="62" height="19" rx="9" fill="#dcfce7" stroke="#16a34a"/>
    <text x="348" y="481" font-size="11" font-weight="bold" fill="#15803d">shipped</text>
    <text x="500" y="482" font-size="12" font-family="monospace" fill="#0f172a" text-anchor="end">₹6,200.00</text>
    <text x="520" y="482" font-size="11" fill="#475569">14 Mar 2025, 12:40 UTC</text>
    <text x="650" y="482" font-size="12" fill="#1e293b">EAST</text>
    <text x="730" y="482" font-size="12" fill="#1e293b">store</text>

    <!-- Virtualization Phantom indicator -->
    <rect x="36" y="494" width="810" height="280" fill="#f8fafc" fill-opacity="0.7"/>
    <text x="240" y="610" font-size="16" fill="#94a3b8" font-style="italic">
      ⚡ Virtualized Scroll Window (Only ~22 rows rendered in DOM out of 50,000!)
    </text>

    <!-- Hand-drawn Arrows & Annotations -->
    <!-- Pin arrow -->
    <path d="M 125 350 Q 140 330 180 320" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="185" y="322" font-size="13" font-weight="bold" fill="#d97706">Pinned Column stays visible on scroll!</text>

    <!-- Amount alignment arrow -->
    <path d="M 480 435 Q 480 465 420 480" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="496" font-size="13" font-weight="bold" fill="#2563eb">Right-aligned + Indian ₹ format</text>
  </g>

  <!-- 5. Order Detail Drawer (Activated on Enter / Double Click) -->
  <g filter="url(#hand-drawn)">
    <rect x="862" y="356" width="382" height="420" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>
    <rect x="862" y="356" width="382" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="876" y="382" font-size="15" font-weight="bold" fill="#0f172a">📋 ORDER DETAILS: ORD-000142</text>
    <text x="1220" y="382" font-size="16" font-weight="bold" fill="#64748b">[Esc]</text>

    <!-- Customer Card -->
    <text x="876" y="416" font-size="12" font-weight="bold" fill="#64748b">CUSTOMER INFO</text>
    <text x="876" y="434" font-size="14" font-weight="bold" fill="#0f172a">Rohan Sharma</text>
    <text x="876" y="450" font-size="12" fill="#64748b">rohan.sharma@example.com</text>

    <line x1="876" y1="462" x2="1230" y2="462" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Amount Card -->
    <text x="876" y="482" font-size="12" font-weight="bold" fill="#64748b">AMOUNT (₹ INR)</text>
    <text x="876" y="506" font-size="20" font-weight="bold" fill="#15803d">₹8,499.00</text>
    <text x="876" y="522" font-size="11" fill="#64748b">(Schema v1 converted from 849900 paise)</text>

    <line x1="876" y1="534" x2="1230" y2="534" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Logistics -->
    <text x="876" y="554" font-size="12" font-weight="bold" fill="#64748b">METADATA</text>
    <text x="876" y="572" font-size="12" fill="#334155">Region: <tspan font-weight="bold">NORTH</tspan> | Channel: <tspan font-weight="bold">web</tspan></text>
    <text x="876" y="590" font-size="12" fill="#334155">Priority: <tspan font-weight="bold">1 (High)</tspan> | Payment: <tspan font-weight="bold">UPI</tspan></text>

    <line x1="876" y1="602" x2="1230" y2="602" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Notes (Sanitized Plain Text) -->
    <text x="876" y="622" font-size="12" font-weight="bold" fill="#64748b">STAFF NOTES (Plain text - no HTML!):</text>
    <rect x="876" y="632" width="354" height="74" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="886" y="654" font-size="12" fill="#334155">Customer requested expedited priority dispatch.</text>
    <text x="886" y="674" font-size="12" fill="#334155">Verified UPI payment trans-9941.</text>

    <!-- Drawer Footer -->
    <rect x="876" y="725" width="354" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1000" y="747" font-size="13" font-weight="bold" fill="#475569">Close Drawer [Esc]</text>

    <!-- Arrow to drawer -->
    <path d="M 830 410 Q 845 390 862 390" fill="none" stroke="#0284c7" stroke-width="2"/>
    <text x="730" y="348" font-size="12" font-weight="bold" fill="#0284c7">[Enter] opens Details Panel</text>
  </g>

  <!-- Footer Banner -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="792" width="1208" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="813" font-size="13" fill="#64748b">Merkle Science Take-Home Assessment • Step 1 Design Planning • Excalidraw Wireframe</text>
    <text x="1030" y="813" font-size="13" font-weight="bold" fill="#15803d">✓ 100% Custom Virtual Grid &amp; Filter</text>
  </g>
</svg>
