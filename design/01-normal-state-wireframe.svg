  <text x="822" y="444" fill="#94a3b8" font-size="11">Created: <tspan fill="#f8fafc">14 Mar 2025, 09:30 UTC</tspan></text>
  <text x="822" y="462" fill="#94a3b8" font-size="11">Updated: <tspan fill="#f8fafc">14 Mar 2025, 10:15 UTC</tspan></text>
  <text x="822" y="480" fill="#94a3b8" font-size="11">Region: <tspan fill="#f8fafc">NORTH</tspan> | Channel: <tspan fill="#f8fafc">web</tspan></text>
  <text x="822" y="498" fill="#94a3b8" font-size="11">Payment: <tspan fill="#f8fafc">UPI</tspan> | Priority: <tspan fill="#f8fafc">1 (High)</tspan></text>

  <line x1="822" y1="512" x2="1160" y2="512" stroke="#334155"/>

  <text x="822" y="532" fill="#64748b" font-size="11">STAFF NOTES (Sanitized Plain Text)</text>
  <rect x="822" y="542" width="346" height="80" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="832" y="562" fill="#cbd5e1" font-size="11">Customer requested expedited priority dispatch.</text>
  <text x="832" y="580" fill="#cbd5e1" font-size="11">Verified payment via UPI gateway trans-9941.</text>

  <rect x="822" y="670" width="346" height="32" rx="4" fill="#334155"/>
