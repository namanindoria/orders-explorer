  <rect x="360" y="10" width="340" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="372" y="28" fill="#64748b" font-size="12">⌨ Shortcuts: [↑↓←→ Move] [Space Select] [Enter Details]</text>
  
  <!-- Export & Stats in Header -->
  <rect x="940" y="10" width="110" height="28" rx="4" fill="#3b82f6" stroke="#2563eb"/>
