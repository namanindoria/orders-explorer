  <!-- Filter Builder Section (Active strict condition causing 0 matches) -->
  <rect x="16" y="58" width="1168" height="116" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="32" y="80" fill="#e2e8f0" font-size="13" font-weight="bold">⚡ FILTER BUILDER (Groups combine with AND · Inside group with OR)</text>
  
  <!-- Group 1 -->
  <rect x="32" y="92" width="620" height="70" rx="4" fill="#0f172a" stroke="#ef4444" stroke-dasharray="3,3"/>
  <text x="44" y="110" fill="#f87171" font-size="11">Group 1 (Strict Filter)</text>
  <rect x="170" y="98" width="80" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
  <text x="178" y="114" fill="#cbd5e1" font-size="11">amount</text>
  <rect x="255" y="98" width="40" height="24" rx="3" fill="#1e293b" stroke="#64748b"/>
