  <!-- Empty State Area (replaces table body) -->
  <rect x="16" y="226" width="1168" height="500" rx="6" fill="#1e293b" stroke="#334155"/>
  
  <!-- Empty State Card / Artwork -->
  <circle cx="600" cy="400" r="44" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="585" y="412" font-size="36" fill="#94a3b8">🔍</text>
  
