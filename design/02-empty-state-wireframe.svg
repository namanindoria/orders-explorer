<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" style="background:#fdfbf7; font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive, sans-serif;">
  <defs>
    <!-- Sketch filter for hand-drawn wobble effect -->
    <filter id="hand-drawn" x="-1%" y="-1%" width="102%" height="102%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Canvas Paper Grid Pattern -->
  <rect width="1280" height="840" fill="#fdfbf7"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.8" fill="#e5e5e0" />
  </pattern>
  <rect width="1280" height="840" fill="url(#grid)" />

  <!-- Title & Brainstorming Header -->
  <g filter="url(#hand-drawn)">
    <text x="36" y="44" font-size="24" font-weight="bold" fill="#1e293b">✏️ Orders Explorer — Empty State Sketch (Zero Matches)</text>
    <text x="36" y="68" font-size="14" fill="#64748b">State: User applied strict filters that exclude all records • Must show clear reason &amp; reset CTA</text>

    <!-- Post-it Note: Empty State Requirement -->
    <rect x="940" y="20" width="300" height="74" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="3,1" transform="rotate(1 940 20)"/>
    <text x="955" y="42" font-size="13" font-weight="bold" fill="#854d0e" transform="rotate(1 940 20)">📌 Requirement (data-notes.md):</text>
    <text x="955" y="60" font-size="12" fill="#854d0e" transform="rotate(1 940 20)">• Clear message when 0 rows match</text>
    <text x="955" y="78" font-size="12" fill="#854d0e" transform="rotate(1 940 20)">• Easy one-click way to clear filters</text>
  </g>

  <!-- 1. Top Navbar Wireframe -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="105" width="1208" height="46" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>
    <text x="52" y="134" font-size="17" font-weight="bold" fill="#0f172a">◈ Merkle Science | Orders Explorer</text>
    
    <!-- Keyboard Cheatsheet Pill -->
    <rect x="360" y="114" width="410" height="28" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="375" y="133" font-size="13" fill="#475569">⌨ [↑↓←→ Move]  [Space Select]  [Enter Details]  [Esc Close]</text>

    <!-- Export Button Box (Disabled: 0) -->
    <rect x="1065" y="112" width="165" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1086" y="133" font-size="14" font-weight="bold" fill="#94a3b8">📥 Export CSV (0)</text>
  </g>

  <!-- 2. Filter Builder Wireframe (Strict condition causing 0 matches) -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="165" width="1208" height="110" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>
    <text x="52" y="188" font-size="15" font-weight="bold" fill="#334155">⚡ FILTER BUILDER (1 Active Strict Condition)</text>

    <!-- Group 1 -->
    <rect x="52" y="200" width="560" height="64" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5,3"/>
    <text x="64" y="218" font-size="12" font-weight="bold" fill="#be123c">Group 1 (Strict Filter)</text>
    
    <!-- Strict Condition: amount > 99999999 -->
    <rect x="190" y="212" width="80" height="28" rx="3" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <text x="200" y="231" font-size="13" fill="#1e293b">amount</text>
    <rect x="278" y="212" width="40" height="28" rx="3" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <text x="290" y="231" font-size="14" fill="#1e293b">&gt;</text>
    <rect x="326" y="212" width="120" height="28" rx="3" fill="#ffffff" stroke="#e11d48" stroke-width="1.8"/>
    <text x="336" y="231" font-size="13" font-weight="bold" fill="#be123c">₹99,999,999</text>
    <text x="456" y="232" font-size="18" font-weight="bold" fill="#e11d48">×</text>

    <!-- + Add Condition -->
    <rect x="64" y="232" width="115" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="72" y="247" font-size="11" fill="#475569">+ Add Condition (OR)</text>

    <!-- + Add Group button -->
    <rect x="630" y="212" width="112" height="38" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="640" y="236" font-size="13" font-weight="bold" fill="#15803d">+ Add Group</text>
  </g>

  <!-- 3. Active Filter Chips & Counter (0 matches) -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="288" width="1208" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="50" y="313" font-size="13" font-weight="bold" fill="#64748b">ACTIVE CHIPS:</text>
    
    <!-- Strict Chip -->
    <rect x="145" y="295" width="200" height="25" rx="12" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="156" y="312" font-size="12" font-weight="bold" fill="#e11d48">Amount &gt; ₹99,999,999 ×</text>

    <!-- Clear all button highlighted -->
    <rect x="360" y="295" width="105" height="25" rx="12" fill="#e11d48" stroke="#be123c" stroke-width="1.5"/>
    <text x="372" y="312" font-size="12" font-weight="bold" fill="#ffffff">Clear all ↺</text>

    <!-- 0 of 50,000 orders counter -->
    <rect x="1000" y="294" width="234" height="27" rx="4" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <text x="1010" y="312" font-size="13" font-weight="bold" fill="#e11d48">0 of 50,000 orders (0 selected)</text>
  </g>

  <!-- 4. Empty State Canvas Area -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="340" width="1208" height="436" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>

    <!-- Hand-drawn Magnifying Glass Illustration -->
    <circle cx="640" cy="450" r="42" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <line x1="672" y1="482" x2="706" y2="516" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Glass cross lines -->
    <line x1="625" y1="450" x2="655" y2="450" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="640" y1="435" x2="640" y2="465" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Empty State Text -->
    <text x="640" y="555" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">
      No orders match your filter criteria
    </text>
    <text x="640" y="585" font-size="15" fill="#64748b" text-anchor="middle">
      We searched across all 50,000 orders, but none matched the current combination of conditions.
    </text>
    <text x="640" y="608" font-size="14" fill="#94a3b8" text-anchor="middle">
      Try adjusting your filters or click below to restore the complete catalog.
    </text>

    <!-- Big Action Button: Reset All Filters -->
    <rect x="520" y="635" width="240" height="46" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <text x="640" y="664" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ↺ Reset All Filters
    </text>

    <!-- Hand-drawn Annotation Arrow -->
    <path d="M 780 658 Q 830 658 860 635" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="860,635 850,636 854,645" fill="#2563eb"/>
    <text x="870" y="632" font-size="13" font-weight="bold" fill="#2563eb">Instantly resets filter &amp; restores all 50,000 rows!</text>

    <!-- Note on Header Row Persistence -->
    <rect x="60" y="360" width="340" height="50" rx="3" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" transform="rotate(-1 60 360)"/>
    <text x="70" y="380" font-size="12" font-weight="bold" fill="#854d0e" transform="rotate(-1 60 360)">💡 UX Note:</text>
    <text x="70" y="398" font-size="12" fill="#854d0e" transform="rotate(-1 60 360)">Filters and toolbar stay visible so context is never lost.</text>
  </g>

  <!-- Footer Banner -->
  <g filter="url(#hand-drawn)">
    <rect x="36" y="792" width="1208" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="813" font-size="13" fill="#64748b">Merkle Science Take-Home Assessment • Step 1 Design Planning • Excalidraw Wireframe</text>
    <text x="1050" y="813" font-size="13" font-weight="bold" fill="#e11d48">● 0 rows currently rendered</text>
  </g>
</svg>
