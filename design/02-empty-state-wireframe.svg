  <rect x="300" y="98" width="100" height="24" rx="3" fill="#1e293b" stroke="#ef4444"/>
  <text x="310" y="114" fill="#f87171" font-size="11">₹9,999,999</text>
  <text x="410" y="114" fill="#ef4444" font-size="14" font-weight="bold">×</text>

  <rect x="44" y="132" width="95" height="22" rx="3" fill="#334155"/>
  <text x="52" y="147" fill="#cbd5e1" font-size="11">+ Condition (OR)</text>

  <!-- Add Group Button -->
  <rect x="670" y="108" width="90" height="36" rx="4" fill="#1e293b" stroke="#3b82f6"/>
  <text x="682" y="131" fill="#38bdf8" font-size="11" font-weight="bold">+ Add Group</text>

  <!-- Active Filter Chips & Live Result Counts (0 matches) -->
  <rect x="16" y="182" width="1168" height="36" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="28" y="205" fill="#64748b" font-size="11" font-weight="bold">ACTIVE CHIPS:</text>
  
  <rect x="110" y="188" width="180" height="24" rx="12" fill="#7f1d1d" stroke="#ef4444"/>
