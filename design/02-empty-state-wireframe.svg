  <text x="16" y="790" fill="#64748b" font-size="11">Merkle Science Frontend Evaluation • Custom Virtual Grid &amp; Filter Engine • URL Synced</text>
  <text x="1000" y="790" fill="#94a3b8" font-size="11">● 0 rows rendered</text>
